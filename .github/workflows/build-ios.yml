name: Build iOS IPA

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo Prebuild (generates ios/ project + Info.plist)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Verify camera permission is in Info.plist
        run: |
          PLIST=$(find ios -name "Info.plist" | grep -v Pods | grep -v build | head -1)
          echo "Checking $PLIST"
          if /usr/libexec/PlistBuddy -c "Print NSCameraUsageDescription" "$PLIST" 2>/dev/null; then
            echo "✅ NSCameraUsageDescription found"
          else
            echo "❌ NSCameraUsageDescription MISSING — aborting"
            cat "$PLIST"
            exit 1
          fi

      - name: Build unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(ls | grep \.xcworkspace | head -1)
          SCHEME=$(basename $(ls | grep \.xcodeproj | head -1) .xcodeproj)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          cd ..
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in build output"
            find ios/build -type d | head -30
            exit 1
          fi
          echo "✅ Found app at $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ar-height-measure.ipa Payload
          echo "✅ IPA created"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: ar-height-measure.ipa
