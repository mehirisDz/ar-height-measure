name: Build iOS IPA

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios

      - name: Build unsigned IPA
        run: |
          cd ios
          WORKSPACE=$(ls | grep \.xcworkspace | head -1)
          SCHEME=$(basename $(ls | grep \.xcodeproj | head -1) .xcodeproj)
          echo "Building workspace $WORKSPACE with scheme $SCHEME"
          
          # List schemes to verify it exists
          xcodebuild -workspace "$WORKSPACE" -list
          
          # Run the build
          xcodebuild -workspace "$WORKSPACE" \
                     -scheme "$SCHEME" \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build || { echo 'xcodebuild failed'; exit 1; }
          
          cd ..
          mkdir -p Payload
          # Find the generated .app file (the path can vary slightly)
          APP_PATH=$(find ios/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find .app file in build directory"
            exit 1
          fi
          
          mv "$APP_PATH" Payload/
          zip -r ar-height-measure.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: ar-height-measure.ipa
